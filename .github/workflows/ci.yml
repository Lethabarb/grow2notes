# Builds, tests and packages every pull request and every push to main (design.md §10.4, ci.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels that pull request's run in progress. head_ref is empty on a push, so each run on
# main gets a group of its own and always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The Linux half of the MelbourneClock check: its tests pass with the machine clock in UTC as well as on Windows
      # (design.md §14 M2).
      TZ: UTC
      # Where the end-to-end steps run the published app; playwright.config.ts reads it as the tests' base URL.
      E2E_BASE_URL: http://localhost:5000
      # The sa password of the sqlserver service below. It is not a secret: that container is made for this job, holds
      # no data and is removed when the job ends.
      E2E_SA_PASSWORD: Grow2Notes-CI-only-1
    services:
      # The end-to-end tests' database (design.md §10.4 step 4). The image is the one the integration tests'
      # Testcontainers fixture pins (tests/Grow2Notes.Tests/Fixtures/SqlServerFixture.cs), so both test against the same
      # engine build and the Test step finds it already pulled; change the two together. The job's steps start once SQL
      # Server answers a query.
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ env.E2E_SA_PASSWORD }}
        ports:
          - 1433:1433
        # The health check runs inside the container, so it reads the password from the container's environment.
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      # Every action, the first-party actions/* ones included, is pinned to a full commit SHA with its release in a
      # trailing comment (design.md §9.11): a tag can be moved to other code, a commit cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token is not left in .git/config for later steps to read.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            src/grow2notes-spa/package-lock.json
            tests/e2e/package-lock.json

      # Installs the latest 10.0 SDK, which global.json's rollForward latestFeature accepts.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # SPA (design.md §10.4 step 2). It runs before the .NET steps: the web project serves the Vite build from
      # wwwroot, MapStaticAssets lists those files when the project is built, and the test project's build stops
      # without them.
      - name: Install SPA packages
        working-directory: src/grow2notes-spa
        run: npm ci

      # Only the dependencies bundled into the browser build are audited; high and critical advisories fail the run
      # (design.md §9.11).
      - name: Audit SPA packages
        working-directory: src/grow2notes-spa
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check the SPA
        working-directory: src/grow2notes-spa
        run: npm run typecheck

      - name: Lint the SPA
        working-directory: src/grow2notes-spa
        run: npm run lint

      - name: Test the SPA
        working-directory: src/grow2notes-spa
        run: npm test

      - name: Build the SPA
        working-directory: src/grow2notes-spa
        run: npm run build

      # .NET (design.md §10.4 step 1).
      - name: Restore .NET tools
        run: dotnet tool restore

      # NuGet Audit runs as part of restore; Directory.Build.props makes high and critical advisories fail it.
      - name: Restore NuGet packages
        run: dotnet restore Grow2Notes.slnx

      # Directory.Build.props already treats warnings as errors; the switch keeps that true here even if a project
      # turns it off.
      - name: Build
        run: dotnet build Grow2Notes.slnx --no-restore --configuration Release -warnaserror

      # The integration tests start SQL Server in Docker through Testcontainers.
      - name: Test
        run: dotnet test Grow2Notes.slnx --no-build --configuration Release

      - name: Check for model changes without a migration
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Grow2Notes.Web
          --context Grow2NotesDbContext
          --configuration Release
          --no-build

      # Package (design.md §10.4 step 3). What production deploys is made once, here, into artifacts/.
      # The tested Release build is published as it is, with the SPA build in its wwwroot. App Service's zip deploy
      # takes the contents of the publish folder at the root of the zip.
      - name: Package the app as app.zip
        run: |
          dotnet publish src/Grow2Notes.Web --configuration Release --no-build --output "$RUNNER_TEMP/app"
          mkdir -p artifacts
          cd "$RUNNER_TEMP/app"
          zip -q -r "$GITHUB_WORKSPACE/artifacts/app.zip" .

      # For review only; the deploy applies the bundle (design.md §10.6).
      - name: Script the migrations as migrate.sql
        run: >-
          dotnet ef migrations script
          --idempotent
          --project src/Grow2Notes.Web
          --context Grow2NotesDbContext
          --configuration Release
          --no-build
          --output artifacts/migrate.sql

      # The bundle always builds its own linux-x64 copy of the project, so --no-build only skips building the
      # portable one again.
      - name: Bundle the migrations as efbundle
        run: >-
          dotnet ef migrations bundle
          --self-contained
          --target-runtime linux-x64
          --project src/Grow2Notes.Web
          --context Grow2NotesDbContext
          --configuration Release
          --no-build
          --output artifacts/efbundle

      # Each top-level .bicep file in infra/ is built to ARM JSON, with the modules it uses built into it, and each
      # environment's .bicepparam to <environment>.parameters.json, which holds only the parameter values. A deploy
      # then needs nothing outside this run's artifact: main.json with its environment's parameters file. --outfile
      # rather than --outdir, which would name test.bicepparam's output test.json, like a template.
      - name: Build the Bicep
        run: |
          shopt -s nullglob
          files=(infra/*.bicep)
          if [ ${#files[@]} -eq 0 ]; then
            echo "infra/ has no Bicep files, so there is nothing to build."
            exit 0
          fi
          mkdir -p artifacts/infra
          for file in "${files[@]}"; do
            az bicep build --file "$file" --outdir artifacts/infra
          done
          for file in infra/*.bicepparam; do
            environment=$(basename "$file" .bicepparam)
            az bicep build-params --file "$file" --outfile "artifacts/infra/$environment.parameters.json"
          done

      # End-to-end (design.md §10.4 step 4). The packaged app runs against the sqlserver service, migrated by the
      # packaged bundle, as a deploy does it.
      - name: Install the end-to-end test packages
        working-directory: tests/e2e
        run: npm ci

      - name: Type-check the end-to-end tests
        working-directory: tests/e2e
        run: npm run typecheck

      # Not cached: Playwright's CI guide advises against it, because restoring the browsers takes about as long as
      # downloading them, and the system packages that --with-deps installs cannot be cached.
      - name: Install Chromium for Playwright
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      # Running the bundle here also proves it works before a deploy depends on it. The container's certificate is
      # self-signed, hence TrustServerCertificate.
      - name: Migrate the end-to-end database with efbundle
        env:
          ConnectionStrings__Grow2Notes: Server=localhost,1433;Database=Grow2Notes;User ID=sa;Password=${{ env.E2E_SA_PASSWORD }};TrustServerCertificate=True
        run: artifacts/efbundle --connection "$ConnectionStrings__Grow2Notes"

      # The unzipped app.zip, run as App Service runs it, and left running in the background for the tests. In
      # Production the app loads appsettings.json only, so the connection string comes from the environment, and it
      # keeps its Data Protection keys in the migrated database.
      - name: Start the app from app.zip
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: ${{ env.E2E_BASE_URL }}
          ConnectionStrings__Grow2Notes: Server=localhost,1433;Database=Grow2Notes;User ID=sa;Password=${{ env.E2E_SA_PASSWORD }};TrustServerCertificate=True
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          unzip -q artifacts/app.zip -d "$RUNNER_TEMP/e2e/app"
          cd "$RUNNER_TEMP/e2e/app"
          dotnet Grow2Notes.Web.dll > "$RUNNER_TEMP/e2e/app.log" 2>&1 &
          echo "E2E_APP_PID=$!" >> "$GITHUB_ENV"

      # curl retries a refused connection and the 503 that /healthz/ready returns until the database check passes.
      - name: Wait for the app to be ready
        run: |
          if ! curl --fail --silent --show-error --output /dev/null --max-time 10 \
            --retry 30 --retry-delay 2 --retry-max-time 60 --retry-connrefused "$E2E_BASE_URL/healthz/ready"; then
            echo "::error::The app was not ready at $E2E_BASE_URL/healthz/ready after a minute; a later step prints its log."
            exit 1
          fi

      - name: Run the end-to-end tests
        id: e2e
        working-directory: tests/e2e
        run: npm test

      - name: Stop the app
        if: always() && env.E2E_APP_PID != ''
        run: kill "$E2E_APP_PID" || echo "The app had already stopped."

      - name: Print the app's log
        if: failure() && env.E2E_APP_PID != ''
        run: cat "$RUNNER_TEMP/e2e/app.log"

      # The HTML report holds each failed test's error and trace; npx playwright show-report opens it. A re-run that
      # fails again replaces the earlier attempt's report rather than failing on the name it already used.
      - name: Upload the Playwright report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          overwrite: true

      # Upload (design.md §10.4 step 5). Production deploys exactly these files; nothing is rebuilt. Only a run whose
      # end-to-end tests passed gets here. Pull request runs upload them too, so migrate.sql can be read in review.
      # deploy.yml downloads the artifact named grow2notes from the CI run it is given (download-artifact's run-id)
      # and must chmod +x efbundle first: an artifact is a zip, which keeps no file permissions. Re-running all jobs
      # deletes a run's earlier artifacts and uploads a fresh build under the same name, so deploy.yml must not assume
      # a run's artifact is the one test received.
      - name: Upload the artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grow2notes
          path: artifacts/
          if-no-files-found: error
          # The longest a public repository allows. Production deploys a named run that is already in test, and a
          # rollback redeploys an earlier run's artifact (design.md §10.6), so each is kept as long as it can be.
          retention-days: 90
