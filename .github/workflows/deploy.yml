# Deploys to test whenever CI succeeds on a push to main (design.md §10.4, deploy.yml). Nothing is checked out or
# built: the job downloads the grow2notes artifact of the CI run that triggered it, so test runs exactly what CI built
# and tested. Production is deployed only by hand, by workflow_dispatch naming a CI run that has already passed in
# test; that job is S00.02.04's.
name: Deploy

on:
  # GitHub runs this workflow as it is on main, so a change to this file takes effect only once it is merged.
  workflow_run:
    # ci.yml's name. Renaming that workflow without changing this stops every deploy.
    workflows: [CI]
    types: [completed]
    # Matches the triggering run's head branch, which a pull request from a fork's own main also has; the job's event
    # check keeps such runs out.
    branches: [main]

# Nothing is granted unless a job asks for it.
permissions: {}

jobs:
  deploy-test:
    name: Deploy to test
    # Pull request runs pass and upload artifacts too, but they are builds of unmerged code.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    # efbundle is a self-contained linux-x64 executable.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: test
      url: https://app-grow2notes-test.azurewebsites.net
    # One deploy at a time, and none is cancelled part-way, mid-migration for instance. Deploys queue in the order their
    # CI runs finish, normally commit order because main only accepts up-to-date branches; a waiting deploy is replaced
    # by the next one.
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    permissions:
      # The OIDC token azure/login exchanges: the test deployment identity trusts only this repository's test
      # environment (design.md §9.4).
      id-token: write
      # download-artifact reads another run's artifacts through the Actions API.
      actions: read
    env:
      # The runner's SQL firewall rule, which steps 4 and 6 add and remove. If the runner is lost in between, no later
      # step runs and the rule stays; its name says which run and attempt left it, so it can be deleted by hand.
      FIREWALL_RULE: deploy-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # Pinned to a full commit SHA with its release in a trailing comment, like every action here (design.md §9.11).
      - name: Download the CI run's artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grow2notes
          path: artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # An artifact is a zip, which keeps no file permissions.
      - name: Make efbundle executable
        run: chmod +x artifacts/efbundle

      # This run's own commit is main's newest when the run was queued, which is not always the one CI built, so the log
      # names the CI run and its commit.
      - name: Show what is deployed
        env:
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "The artifacts of CI run $CI_RUN_ID, built from commit $CI_COMMIT:"
          ls -lR artifacts

      # design.md §10.4 step 1. Given a client ID and no client secret, azure/login signs in with this job's OIDC token.
      # The IDs are environment secrets so that the public log masks them wherever they appear, inside the resource IDs
      # az prints too (D65).
      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # design.md §10.4 step 2. The secrets replace test.parameters.json's empty placeholders (S00.02.02). They reach
      # the script through env, not as expressions in it, which GitHub would paste into the script's text before bash
      # reads it. what-if and create get the same arguments, so the preview is of what is then deployed. create prints
      # only errors: its result would list every resource ID, parameter value and output.
      # Every deploy reuses the name of the first one, made by hand (S00.02.02). Azure refuses a deployment while one
      # with the same name is still running, as it can be after its job is cancelled or times out, so two never overlap.
      # main.bicep puts the app identity's client ID in the app's settings, where what-if may print it, so the log masks
      # it and the principal ID as it does the secrets.
      - name: Deploy main.bicep
        env:
          SQL_ADMIN_GROUP_NAME: ${{ secrets.SQL_ADMIN_GROUP_NAME }}
          SQL_ADMIN_GROUP_OBJECT_ID: ${{ secrets.SQL_ADMIN_GROUP_OBJECT_ID }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          for id in $(az identity show --resource-group rg-grow2notes-test-ause --name id-grow2notes-test-app \
                        --query '[clientId, principalId]' --output tsv --only-show-errors); do
            echo "::add-mask::$id"
          done
          deployment=(
            --resource-group rg-grow2notes-test-ause
            --name grow2notes-test-main
            --template-file artifacts/infra/main.json
            --parameters @artifacts/infra/test.parameters.json
            --parameters sqlAdminGroupName="$SQL_ADMIN_GROUP_NAME" sqlAdminGroupObjectId="$SQL_ADMIN_GROUP_OBJECT_ID"
              alertEmail="$ALERT_EMAIL"
            --only-show-errors
          )
          az deployment group what-if "${deployment[@]}"
          az deployment group create "${deployment[@]}" --output none

      # design.md §10.4 step 3: the time design.md §10.6 restores the database to if the migration damages data. The job
      # summary puts it on the run's page, where it is found without searching the log.
      - name: Record the restore point
        env:
          CI_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          restore_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "Restore point before the migration: $restore_time"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Restore point before the migration

          **$restore_time**, before the migration of commit $CI_COMMIT.

          If this run's migration damages data, this is the point-in-time restore target for sqldb-grow2notes
          (7 days of restore points) on sql-grow2notes-test. The restore makes a new database:

          ~~~bash
          az sql db restore --resource-group rg-grow2notes-test-ause --server sql-grow2notes-test \\
            --name sqldb-grow2notes --dest-name sqldb-grow2notes-restored --time $restore_time
          ~~~
          EOF

      # az keeps the OIDC token it signed in with and presents it again whenever it needs a token for a resource it has
      # none for yet. GitHub's token expires five minutes after it is issued, and what-if and create can take longer
      # than that, so the migration's request for an Azure SQL token would be refused (AADSTS700024). Signing in again
      # just before the database steps gives az a fresh one. The tokens it gets last an hour, longer than the job.
      - name: Sign in to Azure again
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # design.md §10.4 step 4. The server accepts only the app's subnet (design.md §10.1), so the runner's public IPv4
      # address gets a rule of its own for the migration. The address comes from a third party, so an answer that is
      # not an IPv4 address fails the step before it reaches az or the log.
      - name: Allow the runner through the SQL firewall
        id: allow-runner
        run: |
          ip=$(curl -fsS --retry 3 --retry-all-errors --max-time 10 https://api.ipify.org)
          if [[ ! $ip =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "::error::api.ipify.org did not answer with an IPv4 address."
            exit 1
          fi
          echo "Allowing $ip through the firewall of sql-grow2notes-test as $FIREWALL_RULE."
          az sql server firewall-rule create --resource-group rg-grow2notes-test-ause --server sql-grow2notes-test \
            --name "$FIREWALL_RULE" --start-ip-address "$ip" --end-ip-address "$ip" --output none --only-show-errors

      # design.md §10.4 step 5. Active Directory Default has SqlClient sign in with DefaultAzureCredential, which uses
      # the Azure CLI's sign-in: the deployment identity, a member of db_owner (infra/sql/grant-identities.sql). The
      # string holds no secret. The free-offer database pauses when idle and refuses logins with error 40613 for about a
      # minute while it resumes. Program.cs's retrying execution strategy outlasts that: six retries spread over about a
      # minute of back-off, and SqlClient retries a refused login once itself, ten seconds later, when its connect
      # timeout allows.
      - name: Migrate the database
        env:
          ConnectionStrings__Grow2Notes: >-
            Server=tcp:sql-grow2notes-test.database.windows.net,1433; Database=sqldb-grow2notes;
            Authentication=Active Directory Default; Encrypt=Strict
        run: artifacts/efbundle --connection "$ConnectionStrings__Grow2Notes"

      # design.md §10.4 step 6. always() runs it after a failed migration or a cancelled run too, whenever step 4 has
      # started, even if step 4 then failed. A rule that was never created is no error: Azure answers its delete with
      # 204 No Content, which az accepts.
      - name: Remove the runner's firewall rule
        if: always() && steps.allow-runner.outcome != 'skipped'
        run: >-
          az sql server firewall-rule delete --resource-group rg-grow2notes-test-ause --server sql-grow2notes-test
          --name "$FIREWALL_RULE" --output none --only-show-errors

      # design.md §10.4 step 7. The app accepts no basic-auth publishing credentials (design.md §9.4), so there is no
      # publish profile: the action presents a token from the Azure CLI's sign-in to the app's Kudu (scm) site, which
      # the deployment identity's Contributor role lets in. Kudu's defaults for a zip suit an app that is already
      # published: it deletes the previous files, unpacks the publish output that ci.yml put at the zip's root, builds
      # nothing (SCM_DO_BUILD_DURING_DEPLOYMENT is not set) and restarts the app. App Service starts the only assembly
      # with a .runtimeconfig.json, Grow2Notes.Web.dll, so no startup command is set. v3 is the current major; GitHub
      # can label a later patch to v2 as the latest release.
      - name: Deploy app.zip
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: app-grow2notes-test
          # The subscription is shared with other workloads (D60), so the group makes the action's lookup of the app
          # by name explicit.
          resource-group-name: rg-grow2notes-test-ause
          package: artifacts/app.zip

      # design.md §10.4 step 8, /healthz only until S00.03.04 adds /api/auth/antiforgery. /healthz never touches the
      # database (design.md §10.8). webapps-deploy returns once Kudu has asked App Service to restart the app, not once
      # the new build answers: it does not track the restart as az webapp deploy does, and nothing the app serves names
      # its build. So a 200 in the first seconds can come from the old build before the restart stops it; this step
      # cannot tell the two apart, and catches a new build that does not start only if the old one has stopped first.
      # curl retries every error, App Service's 5xx answers while the app restarts included, every 10 seconds for up to
      # five minutes, to allow for the restart and a cold start on B1.
      - name: Smoke-test /healthz
        env:
          HEALTHZ_URL: https://app-grow2notes-test.azurewebsites.net/healthz
        run: |
          if ! body=$(curl -fsS --max-time 20 --retry 30 --retry-delay 10 --retry-max-time 300 --retry-all-errors \
                        "$HEALTHZ_URL"); then
            echo "::error::$HEALTHZ_URL did not answer 200 OK within five minutes."
            exit 1
          fi
          echo "$HEALTHZ_URL answered: $body"
